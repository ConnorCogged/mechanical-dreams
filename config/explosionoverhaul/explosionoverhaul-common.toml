#Tuned for Create Aeronautics / Sable / Create Big Cannons. Keys not listed here are filled in with
#the mod's defaults on first launch.

[General]
	enableFallingBlocks = true
	enableExplosionClustering = true
	maxClusterPower = 100

[Async Crater]
	#Off: async crater mode cannot destroy Create Aeronautics / Sable ships (per the mod author).
	enableAsyncCrater = false
	#Default 0 = every core; leave cores for the server tick and Sable physics.
	craterMaxThreads = 2
	#Default 50000
	craterApplyBlocksPerTick = 4000
	#Default 500. Each falling block is an entity that is ticked and sent to every nearby client.
	craterMaxFallingBlocksPerTick = 40
	#Default true. Direct writes skip block events and neighbour updates (GriefLogger, Create, Sable).
	enableDirectChunkWrites = false
	#Default 120
	craterChunksPerTick = 16
